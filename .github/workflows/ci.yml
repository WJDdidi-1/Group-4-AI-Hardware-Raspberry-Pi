name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Scripts parse (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every script
        run: python -m compileall -q .
      - name: Check requirements is installable as a set
        run: python -m pip install --dry-run -q -r requirements.txt || true
